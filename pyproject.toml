[project]
name = "ibs-cbs-copilot"
version = "0.1.0"
description = ""
authors = [
    {name = "Nelson Dell", email = "juniordell123@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "llama-index (>=0.14.23,<0.15.0)",
    "openai (>=2.46.0,<3.0.0)",
    "psycopg[binary,pool] (>=3.3.4,<4.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pymupdf (>=1.28.0,<2.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)",
    "anthropic (>=0.119.0,<0.120.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "redis (>=8.0.1,<9.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "langfuse (>=4.14.1,<5.0.0)"
]

[dependency-groups]
dev = [
    "notebook (>=7.6.1,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ragas (>=0.4.3,<0.5.0)",
    "datasets (>=5.0.0,<6.0.0)",
    "mlflow (>=3.14.0,<4.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"